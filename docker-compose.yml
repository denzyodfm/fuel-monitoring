services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fuel_monitoring
      MYSQL_USER: fuel
      MYSQL_PASSWORD: fuel_password
      MYSQL_ROOT_PASSWORD: root_password
      TZ: Asia/Manila
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    env_file: .env
    ports: ["3010:3010"]
    depends_on:
      db: {condition: service_healthy}
    volumes: ["./uploads:/app/uploads"]
volumes: {mysql_data: {}}
